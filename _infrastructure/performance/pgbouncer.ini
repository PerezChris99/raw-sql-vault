;; ============================================================================
;; PgBouncer Configuration - Production Ready
;; Raw SQL Vault Projects
;; ============================================================================
;; Place this file at /etc/pgbouncer/pgbouncer.ini
;; ============================================================================

[databases]
;; Database connection strings
;; Format: dbname = host=hostname port=5432 dbname=actual_db_name

;; Projects 1-8
agriculture_yield = host=localhost port=5432 dbname=agriculture_yield
corruption_auditor = host=localhost port=5432 dbname=corruption_auditor
education_dropout = host=localhost port=5432 dbname=education_dropout
healthcare_outbreak = host=localhost port=5432 dbname=healthcare_outbreak
job_matching = host=localhost port=5432 dbname=job_matching
power_outage = host=localhost port=5432 dbname=power_outage
road_condition = host=localhost port=5432 dbname=road_condition
water_point = host=localhost port=5432 dbname=water_point

;; Projects 9-15
refugee_aid = host=localhost port=5432 dbname=refugee_aid
waste_collection = host=localhost port=5432 dbname=waste_collection
boda_accidents = host=localhost port=5432 dbname=boda_accidents
fishery_quota = host=localhost port=5432 dbname=fishery_quota
tea_prices = host=localhost port=5432 dbname=tea_prices
land_disputes = host=localhost port=5432 dbname=land_disputes
milk_supply = host=localhost port=5432 dbname=milk_supply

;; Wildcard for dynamic databases (optional)
;; * = host=localhost port=5432

[pgbouncer]
;; ============================================================================
;; Connection pooling settings
;; ============================================================================

;; Listening address and port
listen_addr = 127.0.0.1
listen_port = 6432

;; Authentication
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

;; Pool mode:
;; - session: Connection assigned for entire session (safest)
;; - transaction: Connection returned after each transaction (recommended)
;; - statement: Connection returned after each statement (most aggressive)
pool_mode = transaction

;; ============================================================================
;; Pool sizing (tune based on your workload)
;; ============================================================================

;; Default pool size per database/user pair
default_pool_size = 20

;; Minimum pool size (kept ready)
min_pool_size = 5

;; Maximum number of connections per pool (hard limit)
max_client_conn = 200

;; How many additional connections to allow above pool_size during peak
reserve_pool_size = 5

;; Time before reserve connections are released
reserve_pool_timeout = 3

;; ============================================================================
;; Timeouts (prevent hung connections)
;; ============================================================================

;; Close server connections that have been idle > this many seconds
server_idle_timeout = 600

;; Close client connections that have been idle > this many seconds
client_idle_timeout = 300

;; Cancel query if client disconnects
cancel_after = query

;; Maximum time to wait for a server connection
server_connect_timeout = 15

;; Maximum time for a query to complete on server side
query_timeout = 120

;; Maximum time for client to send query
client_login_timeout = 60

;; ============================================================================
;; Security settings
;; ============================================================================

;; Do not allow access to pgbouncer virtual database
admin_users = pgbouncer_admin
stats_users = pgbouncer_stats

;; Log settings
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1

;; Require TLS for client connections (production)
;; client_tls_sslmode = require
;; client_tls_cert_file = /etc/pgbouncer/server.crt
;; client_tls_key_file = /etc/pgbouncer/server.key

;; ============================================================================
;; Performance tuning
;; ============================================================================

;; TCP keepalive settings
tcp_keepalive = 1
tcp_keepidle = 60
tcp_keepintvl = 30
tcp_keepcnt = 3

;; DNS lookup caching
dns_max_ttl = 15

;; Statement pipelining (PostgreSQL 14+)
;; pipelining = 1

;; ============================================================================
;; Resource limits
;; ============================================================================

;; Maximum memory per connection
;; max_packet_size = 16384

;; Set to 'yes' to disable auto database creation
;; disable_pqexec = no

;; ============================================================================
;; Logging
;; ============================================================================

logfile = /var/log/pgbouncer/pgbouncer.log
pidfile = /var/run/pgbouncer/pgbouncer.pid

;; Log level: debug, info, notice, warning, error
log_level = info

;; ============================================================================
;; Statistics
;; ============================================================================

;; How often to write statistics to log
stats_period = 60


;; ============================================================================
;; USERLIST.TXT FORMAT (place at /etc/pgbouncer/userlist.txt)
;; ============================================================================
;; "username" "password_hash"
;;
;; Generate password hash with:
;; echo -n "md5$(echo -n 'password_here_username' | md5sum | cut -d' ' -f1)"
;;
;; Example userlist.txt:
;; "app_service" "md5abc123..."
;; "app_readonly" "md5def456..."
;; ============================================================================
