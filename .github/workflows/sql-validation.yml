name: SQL Validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shell and recursive include checks
        run: bash tools/lint_sql.sh

  postgres-regression:
    needs: static-validation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:15-3.5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vault_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vault_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vault_test
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Run integrated SQL regression suites
        run: bash tools/run_sql_tests.sh
